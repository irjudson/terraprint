<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terraprint Mission Planner</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a1a2e;
      --surface: #16213e;
      --card:    #0f3460;
      --accent:  #e94560;
      --green:   #4caf50;
      --text:    #eaeaea;
      --muted:   #8899aa;
      --radius:  8px;
      --shadow:  0 4px 20px rgba(0,0,0,.5);
    }

    html, body { height: 100%; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }

    #map { position: fixed; inset: 0; z-index: 0; }

    /* ── top bar ── */
    #topbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; gap: 8px; width: min(600px, calc(100vw - 24px));
    }
    #search {
      flex: 1; padding: 10px 14px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font-size: 14px;
      box-shadow: var(--shadow); outline: none;
    }
    #search::placeholder { color: var(--muted); }
    #search-btn {
      padding: 10px 16px; border: none; border-radius: var(--radius);
      background: var(--card); color: var(--text); cursor: pointer;
      box-shadow: var(--shadow); font-size: 16px;
    }
    #search-btn:hover { background: var(--accent); }

    /* ── autocomplete ── */
    #suggestions {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      width: min(600px, calc(100vw - 24px)); z-index: 1001;
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; display: none;
    }
    .suggestion {
      padding: 10px 14px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .suggestion:hover { background: var(--card); }

    /* ── left toolbar ── */
    #toolbar {
      position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
      z-index: 1000; display: flex; flex-direction: column; gap: 8px;
    }
    .tool-btn {
      width: 44px; height: 44px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); transition: background .15s;
    }
    .tool-btn:hover { background: var(--card); }
    .tool-btn.active { background: var(--accent); }

    /* ── bottom panel ── */
    #bottom {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; width: min(700px, calc(100vw - 24px));
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    #mission-type-row {
      padding: 10px 16px 0; display: flex; gap: 8px; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .mode-btn {
      padding: 6px 14px; border: none; border-radius: var(--radius);
      font-size: 12px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--muted); transition: all .15s;
    }
    .mode-btn.active { background: var(--accent); color: #fff; }
    #mode-hint { font-size: 11px; color: var(--muted); padding-left: 4px; }

    #params {
      padding: 14px 16px; display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      gap: 12px; border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .param-group { display: flex; flex-direction: column; gap: 4px; }
    .param-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .param-group input {
      background: var(--card); border: none; border-radius: 4px;
      color: var(--text); padding: 6px 8px; font-size: 14px; width: 100%; outline: none;
    }
    .param-group input:focus { box-shadow: 0 0 0 2px var(--accent); }

    #actions { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
    #stats { flex: 1; font-size: 12px; color: var(--muted); }
    #stats span { color: var(--text); font-weight: 600; }

    .action-btn {
      padding: 10px 20px; border: none; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s;
      white-space: nowrap;
    }
    #btn-generate { background: var(--card); color: var(--text); }
    #btn-generate:hover:not(:disabled) { background: #1a4a80; }
    #btn-push { background: var(--accent); color: #fff; }
    #btn-push:hover:not(:disabled) { background: #c73350; }
    .action-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── toast ── */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      z-index: 2000; padding: 10px 20px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.ok  { background: var(--green); color: #fff; }
    #toast.err { background: var(--accent); color: #fff; }
    #toast.info { background: var(--card); color: var(--text); }

    /* ── settings panel ── */
    #settings-panel {
      position: fixed; left: 68px; top: 50%; transform: translateY(-50%);
      z-index: 1001; display: none;
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 16px; width: 280px;
      flex-direction: column; gap: 12px;
    }
    #settings-panel.open { display: flex; }
    .settings-row { display: flex; flex-direction: column; gap: 4px; }
    .settings-row label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .settings-token-row { display: flex; gap: 6px; }
    .settings-token-row input {
      flex: 1; background: var(--card); border: none; border-radius: 4px;
      color: var(--text); padding: 6px 8px; font-size: 13px; outline: none;
      font-family: monospace;
    }
    .settings-token-row input:focus { box-shadow: 0 0 0 2px var(--accent); }
    #btn-save-token {
      padding: 6px 12px; border: none; border-radius: 4px;
      background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
    }
    #btn-save-token:hover { background: #c73350; }

    /* ── name field in topbar when polygon drawn ── */
    #name-wrap {
      position: fixed; top: 12px; right: 12px; z-index: 1000; display: none;
    }
    #mission-name {
      padding: 10px 14px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font-size: 14px;
      box-shadow: var(--shadow); outline: none; width: 200px;
    }
    #mission-name::placeholder { color: var(--muted); }

    /* ── missions sidebar ── */
    #missions-panel {
      position: fixed; left: 68px; top: 12px; bottom: 12px;
      z-index: 1000; width: 280px;
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); display: none; flex-direction: column;
      overflow: hidden;
    }
    #missions-panel.open { display: flex; }
    #missions-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    #missions-header h3 { font-size: 13px; font-weight: 600; margin: 0; }
    #btn-sync-phone {
      padding: 4px 10px; border: none; border-radius: 4px;
      background: var(--card); color: var(--text); font-size: 11px;
      cursor: pointer; white-space: nowrap;
    }
    #btn-sync-phone:hover { background: var(--accent); }
    #missions-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .mission-item {
      padding: 8px 14px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.03);
      transition: background .1s;
    }
    .mission-item:hover { background: rgba(255,255,255,.04); }
    .mission-item.selected { background: var(--card); }
    .mission-item-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .mission-item-meta { font-size: 11px; color: var(--muted); }
    .mission-status {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; margin-left: 6px;
    }
    .status-planned    { background: #333; color: #aaa; }
    .status-on_phone   { background: #1a4a80; color: #7ab4f5; }
    .status-flown      { background: #1a4a1a; color: #7af57a; }
    .status-processing { background: #4a3a1a; color: #f5c57a; }
    .status-processed  { background: #2a4a2a; color: #4caf50; }

    /* ── flights sub-panel ── */
    .mission-flights {
      display: none; border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.15); padding: 8px 10px;
    }
    .mission-flights.open { display: block; }
    .flight-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: 11px;
    }
    .flight-row:last-child { border-bottom: none; }
    .flight-info { flex: 1; min-width: 0; }
    .flight-dir  { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flight-meta { color: var(--muted); }
    .pipeline-bar {
      display: flex; gap: 3px; align-items: center; margin-top: 3px;
    }
    .pipeline-step {
      padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .step-pending  { background: #333; color: #666; }
    .step-running  { background: #4a3a1a; color: #f5c57a; }
    .step-done     { background: #1a3a1a; color: #4caf50; }
    .step-failed   { background: #3a1a1a; color: #f55; }
    .flight-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .flight-btn {
      padding: 2px 7px; border: none; border-radius: 3px;
      font-size: 10px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--muted);
    }
    .flight-btn:hover { background: var(--accent); color: #fff; }
    .flight-btn.danger:hover { background: #c0392b; }
    .log-flight-row {
      padding: 6px 0 2px; display: flex; gap: 6px; align-items: center;
    }
    .log-flight-row select {
      flex: 1; background: var(--card); border: none; border-radius: 4px;
      color: var(--text); padding: 4px 6px; font-size: 11px; outline: none;
    }
    .log-flight-row select:disabled { opacity: .4; }
    .btn-log-confirm {
      padding: 4px 10px; border: none; border-radius: 4px;
      background: var(--accent); color: #fff; font-size: 11px;
      font-weight: 600; cursor: pointer;
    }
    .btn-log-confirm:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Top search bar -->
<div id="topbar">
  <input id="search" type="text" placeholder="Search a place…" autocomplete="off">
  <button id="search-btn" title="Search">🔍</button>
</div>
<div id="suggestions"></div>

<!-- Mission name (shown after polygon drawn) -->
<div id="name-wrap">
  <input id="mission-name" type="text" placeholder="Mission name…">
</div>

<!-- Left toolbar -->
<div id="toolbar">
  <button class="tool-btn" id="btn-satellite" title="Toggle satellite view">🛰</button>
  <button class="tool-btn" id="btn-draw" title="Draw polygon">⬡</button>
  <button class="tool-btn" id="btn-clear" title="Clear polygon">✕</button>
  <button class="tool-btn" id="btn-units" title="Toggle units">m</button>
  <button class="tool-btn" id="btn-settings" title="Settings">⚙</button>
  <button class="tool-btn" id="btn-missions" title="Missions">📋</button>
</div>

<!-- Pass legend (shown after photogrammetry preview) -->
<div id="pass-legend" style="
  position:fixed; right:12px; top:60px; z-index:1000;
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:10px 14px; display:none; flex-direction:column; gap:6px; min-width:140px;
">
  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">Passes</div>
</div>

<!-- Bottom panel: params + actions -->
<div id="bottom">
  <div id="mission-type-row">
    <button class="mode-btn active" id="btn-mode-survey">Survey</button>
    <button class="mode-btn" id="btn-mode-photo">Photogrammetry (5-pass)</button>
    <span id="mode-hint">Nadir + N/E/S/W obliques at 45° for full 3D reconstruction</span>
  </div>
  <div id="params">
    <div class="param-group">
      <label>Altitude (m)</label>
      <input id="p-altitude" type="number" value="80" min="20" max="400">
    </div>
    <div class="param-group">
      <label>Overlap (%)</label>
      <input id="p-overlap" type="number" value="80" min="30" max="95">
    </div>
    <div class="param-group">
      <label>Speed (m/s)</label>
      <input id="p-speed" type="number" value="8" min="1" max="15">
    </div>
    <div class="param-group">
      <label>Front overlap (%)</label>
      <input id="p-front" type="number" placeholder="same" min="30" max="95">
    </div>
    <div class="param-group" id="gimbal-group">
      <label>Camera angle</label>
      <select id="p-gimbal" style="background:var(--card);border:none;border-radius:4px;color:var(--text);padding:6px 8px;font-size:14px;width:100%;outline:none;cursor:pointer;">
        <option value="-90">Nadir (↓)</option>
        <option value="-60">High oblique (30°)</option>
        <option value="-45">Oblique (45°)</option>
        <option value="-30">Low oblique (60°)</option>
      </select>
    </div>
  </div>
  <div id="actions">
    <div id="stats">Draw a polygon to plan a mission.</div>
    <button class="action-btn" id="btn-generate" disabled>Generate Preview</button>
    <button class="action-btn" id="btn-push" disabled>📱 Push to Phone</button>
  </div>
</div>

<div id="settings-panel">
  <div class="settings-row">
    <label>Mapbox token</label>
    <div class="settings-token-row">
      <input id="mapbox-token" type="password" placeholder="pk.eyJ1…" autocomplete="off">
      <button id="btn-save-token">Save</button>
    </div>
  </div>
</div>

<!-- Missions sidebar -->
<div id="missions-panel">
  <div id="missions-header">
    <h3>Missions</h3>
    <button id="btn-sync-phone" title="Sync with phone">📱 Sync</button>
  </div>
  <div id="missions-list">
    <div style="padding:14px;font-size:12px;color:var(--muted);">Loading…</div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
// ── Map setup ────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([45.74, -111.47], 15);




let mapboxToken = localStorage.getItem('mapboxToken') || '';
function makeMapboxLayer(token) {
  return L.tileLayer(
    `https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/256/{z}/{x}/{y}?access_token=${token}`,
    { attribution: '© <a href="https://mapbox.com">Mapbox</a>', maxNativeZoom: 22, maxZoom: 22 }
  );
}
function makeUsgsLayer() {
  return L.tileLayer(
    'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'USGS The National Map', maxNativeZoom: 16, maxZoom: 20 }
  );
}
const esriLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: '© Esri, Maxar, Earthstar Geographics', maxNativeZoom: 19, maxZoom: 22 }
);
const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenTopoMap (CC-BY-SA)', maxNativeZoom: 17, maxZoom: 20,
});

let satelliteLayer = mapboxToken ? makeMapboxLayer(mapboxToken) : makeUsgsLayer();

// satMode cycles: 'mapbox' → 'esri' → 'topo'
let satMode = 'mapbox';
satelliteLayer.addTo(map);

// Pre-fill token input if saved
if (mapboxToken) document.getElementById('mapbox-token').value = mapboxToken;

const satLayers  = { mapbox: () => satelliteLayer, esri: () => esriLayer, topo: () => topoLayer };
const satLabels  = { mapbox: '🛰', esri: 'E', topo: '🗻' };
const satNext    = { mapbox: 'esri', esri: 'topo', topo: 'mapbox' };
const satTitles  = { mapbox: 'Mapbox satellite → Esri', esri: 'Esri satellite → Topo', topo: 'Topo → Mapbox satellite' };

function updateSatBtn() {
  const btn = document.getElementById('btn-satellite');
  btn.textContent = satLabels[satMode];
  btn.title = satTitles[satMode];
  btn.classList.add('active');
}
updateSatBtn();

document.getElementById('btn-satellite').addEventListener('click', () => {
  Object.values(satLayers).forEach(fn => { const l = fn(); if (map.hasLayer(l)) map.removeLayer(l); });
  satMode = satNext[satMode];
  satLayers[satMode]().addTo(map);
  updateSatBtn();
});

// ── Settings panel ────────────────────────────────────────────────────────────
// Use server-provided Mapbox token if none is stored locally
if (!mapboxToken) {
  fetch('/api/config').then(r => r.json()).then(cfg => {
    if (cfg.mapbox_token) {
      mapboxToken = cfg.mapbox_token;
      const wasActive = satMode === 'mapbox';
      if (wasActive) map.removeLayer(satelliteLayer);
      satelliteLayer = makeMapboxLayer(mapboxToken);
      if (wasActive) satelliteLayer.addTo(map);
    }
  }).catch(() => {});
}

document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.toggle('open');
});
document.addEventListener('click', e => {
  const panel = document.getElementById('settings-panel');
  const btn   = document.getElementById('btn-settings');
  if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn)
    panel.classList.remove('open');
});
document.getElementById('btn-save-token').addEventListener('click', () => {
  const token = document.getElementById('mapbox-token').value.trim();
  const wasMapbox = satMode === 'mapbox';
  if (wasMapbox) map.removeLayer(satelliteLayer);
  if (token) {
    localStorage.setItem('mapboxToken', token);
    mapboxToken = token;
    satelliteLayer = makeMapboxLayer(token);
    toast('Mapbox satellite activated', 'ok');
  } else {
    localStorage.removeItem('mapboxToken');
    mapboxToken = '';
    satelliteLayer = makeUsgsLayer();
    toast('Switched to USGS imagery', 'info');
  }
  if (wasMapbox) satelliteLayer.addTo(map);
  document.getElementById('settings-panel').classList.remove('open');
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── State ────────────────────────────────────────────────────────────────────
let currentPolygon = null;   // Leaflet layer
let previewLayers  = [];     // flight path polylines (one per pass)
let previewMarkers = [];     // start/end dots
let currentJobId   = null;
let drawing        = false;
let missionMode    = 'survey';
let units          = localStorage.getItem('units') || 'metric';

function formatDist(meters) {
  if (units === 'imperial') {
    const feet = meters * 3.28084;
    return feet < 5280 ? `${Math.round(feet)} ft` : `${(feet / 5280).toFixed(2)} mi`;
  }
  return meters < 1000 ? `${meters} m` : `${(meters / 1000).toFixed(2)} km`;
}
function formatTime(seconds) {
  if (seconds < 60) return `${seconds}s`;
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return s ? `${m}m ${s}s` : `${m} min`;
}

document.getElementById('btn-units').textContent = units === 'imperial' ? 'ft' : 'm';
document.getElementById('btn-units').addEventListener('click', () => {
  units = units === 'metric' ? 'imperial' : 'metric';
  localStorage.setItem('units', units);
  document.getElementById('btn-units').textContent = units === 'imperial' ? 'ft' : 'm';
});

const drawnItems = new L.FeatureGroup().addTo(map);

// ── Leaflet.draw ─────────────────────────────────────────────────────────────
const drawControl = new L.Control.Draw({
  draw: {
    polygon: { shapeOptions: { color: '#e94560', fillOpacity: .15 } },
    rectangle: { shapeOptions: { color: '#e94560', fillOpacity: .15 } },
    polyline: false, circle: false, circlemarker: false, marker: false,
  },
  edit: { featureGroup: drawnItems },
});

map.on(L.Draw.Event.CREATED, e => {
  clearPolygon();
  currentPolygon = e.layer;
  drawnItems.addLayer(currentPolygon);
  document.getElementById('btn-generate').disabled = false;
  document.getElementById('name-wrap').style.display = 'block';
  // Auto-populate name if empty
  const nameEl = document.getElementById('mission-name');
  if (!nameEl.value.trim()) {
    const d = new Date();
    nameEl.value = `Mission ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  document.getElementById('stats').textContent = 'Polygon ready — click Generate Preview.';
  drawing = false;
  document.getElementById('btn-draw').classList.remove('active');
});

map.on(L.Draw.Event.EDITED, () => {
  clearPreview();
  currentJobId = null;
  document.getElementById('btn-push').disabled = true;
});

// ── Toolbar ──────────────────────────────────────────────────────────────────
document.getElementById('btn-draw').addEventListener('click', () => {
  if (drawing) return;
  drawing = true;
  document.getElementById('btn-draw').classList.add('active');
  map.addControl(drawControl);
  new L.Draw.Polygon(map, drawControl.options.draw.polygon).enable();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  clearPolygon();
  clearPreview();
  currentJobId = null;
  window._savedMissionId = null;
  document.getElementById('btn-generate').disabled = true;
  document.getElementById('btn-push').disabled = true;
  document.getElementById('name-wrap').style.display = 'none';
  document.getElementById('stats').textContent = 'Draw a polygon to plan a mission.';
});

function clearPolygon() {
  if (currentPolygon) { drawnItems.removeLayer(currentPolygon); currentPolygon = null; }
}

function clearPreview() {
  previewLayers.forEach(l => map.removeLayer(l));
  previewLayers = [];
  previewMarkers.forEach(m => map.removeLayer(m));
  previewMarkers = [];
  document.getElementById('pass-legend').style.display = 'none';
}

// ── Mission type toggle ────────────────────────────────────────────────────
document.getElementById('btn-mode-survey').addEventListener('click', () => {
  missionMode = 'survey';
  document.getElementById('btn-mode-survey').classList.add('active');
  document.getElementById('btn-mode-photo').classList.remove('active');
  document.getElementById('mode-hint').textContent = '';
  document.getElementById('gimbal-group').style.display = '';
});
document.getElementById('btn-mode-photo').addEventListener('click', () => {
  missionMode = 'photogrammetry';
  document.getElementById('btn-mode-photo').classList.add('active');
  document.getElementById('btn-mode-survey').classList.remove('active');
  document.getElementById('mode-hint').textContent = 'Nadir + N/E/S/W obliques — oblique angle set by Camera angle below';
  document.getElementById('gimbal-group').style.display = '';
});

// ── Search ───────────────────────────────────────────────────────────────────
const searchEl      = document.getElementById('search');
const suggestionsEl = document.getElementById('suggestions');

async function doSearch() {
  const q = searchEl.value.trim();
  if (!q) return;
  suggestionsEl.style.display = 'none';
  try {
    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
    const results = await res.json();
    if (!results.length) { toast('No results found', 'err'); return; }
    renderSuggestions(results);
  } catch (e) { toast('Geocode failed', 'err'); }
}

function renderSuggestions(results) {
  suggestionsEl.innerHTML = '';
  results.slice(0, 5).forEach(r => {
    const div = document.createElement('div');
    div.className = 'suggestion';
    div.textContent = r.display_name;
    div.addEventListener('click', () => {
      suggestionsEl.style.display = 'none';
      searchEl.value = r.display_name.split(',')[0].trim();

      const bb = r.boundingbox; // [s, n, w, e]
      const bounds = [[+bb[0], +bb[2]], [+bb[1], +bb[3]]];
      map.fitBounds(bounds, { padding: [40, 40] });

      // If Nominatim returned a polygon, draw it as the starting polygon
      if (r.geojson && (r.geojson.type === 'Polygon' || r.geojson.type === 'MultiPolygon')) {
        clearPolygon();
        clearPreview();
        currentJobId = null;
        const coords = r.geojson.type === 'Polygon'
          ? r.geojson.coordinates[0]
          : r.geojson.coordinates[0][0];
        const latlngs = coords.map(c => [c[1], c[0]]);
        currentPolygon = L.polygon(latlngs, { color: '#e94560', fillOpacity: .15 });
        drawnItems.addLayer(currentPolygon);
        document.getElementById('btn-generate').disabled = false;
        document.getElementById('name-wrap').style.display = 'block';
        document.getElementById('mission-name').value = searchEl.value;
        document.getElementById('stats').textContent = 'Polygon ready — click Generate Preview.';
      }
    });
    suggestionsEl.appendChild(div);
  });
  suggestionsEl.style.display = 'block';
}

searchEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('search-btn').addEventListener('click', doSearch);
document.addEventListener('click', e => {
  if (!suggestionsEl.contains(e.target) && e.target !== searchEl)
    suggestionsEl.style.display = 'none';
});

// ── Generate ─────────────────────────────────────────────────────────────────
document.getElementById('btn-generate').addEventListener('click', async () => {
  if (!currentPolygon) return;

  const latlngs = currentPolygon.getLatLngs()[0];
  const polygon = latlngs.map(ll => [ll.lat, ll.lng]);
  const nameEl = document.getElementById('mission-name');
  if (!nameEl.value.trim()) {
    const d = new Date();
    nameEl.value = `Mission ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const name = nameEl.value.trim();

  setGenerating(true);
  clearPreview();

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        polygon,
        name,
        altitude:      +document.getElementById('p-altitude').value,
        overlap:       +document.getElementById('p-overlap').value,
        front_overlap: document.getElementById('p-front').value ? +document.getElementById('p-front').value : null,
        speed:         +document.getElementById('p-speed').value,
        gimbal_pitch:  +document.getElementById('p-gimbal').value,
        mission_mode:  missionMode,
      }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.detail || 'Generate failed', 'err'); return; }

    currentJobId = data.job_id;

    // All passes share the same ground track — draw it once, list passes in legend.
    const firstPass = data.passes[0];
    const lls = firstPass.waypoints.map(p => [p[0], p[1]]);
    const trackColor = data.passes.length > 1 ? '#4caf50' : firstPass.color;
    const layer = L.polyline(lls, { color: trackColor, weight: 1.5, opacity: .8 }).addTo(map);
    previewLayers.push(layer);
    previewMarkers.push(
      L.circleMarker(lls[0],            { radius: 6, color: trackColor, fillColor: trackColor, fillOpacity: 1 }).addTo(map),
      L.circleMarker(lls[lls.length-1], { radius: 6, color: '#e94560',  fillColor: '#e94560',  fillOpacity: 1 }).addTo(map)
    );

    const legend = document.getElementById('pass-legend');
    legend.innerHTML = '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">Passes</div>';
    data.passes.forEach(pass => {
      const passLabel = pass.pass === 'nadir'
        ? 'Nadir ↓ (straight down)'
        : pass.pass.charAt(0).toUpperCase() + pass.pass.slice(1) + ` oblique (${Math.abs(pass.gimbal)}°)`;
      legend.innerHTML += `<div style="font-size:12px;display:flex;align-items:center;gap:6px;">
        <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${pass.color}"></span>
        ${passLabel}</div>`;
    });
    if (data.passes.length > 1) {
      legend.innerHTML += `<div style="font-size:11px;color:var(--muted);margin-top:4px;">Same grid, flown ${data.passes.length}×</div>`;
      legend.style.display = 'flex';
    }

    const modeLabel  = data.mode === 'photogrammetry' ? `${data.passes.length}-pass photo` : 'survey';
    document.getElementById('stats').innerHTML =
      `<span>${data.waypoint_count}</span> wpts · <span>${formatDist(data.distance_m)}</span> · ~<span>${formatTime(data.est_sec)}</span> · GSD <span>${data.gsd_cm} cm/px</span> · <span>${modeLabel}</span>`;
    document.getElementById('btn-push').disabled = false;
    toast('Preview ready', 'ok');
  } catch (e) {
    toast('Request failed', 'err');
  } finally {
    setGenerating(false);
  }
});

function setGenerating(on) {
  const btn = document.getElementById('btn-generate');
  btn.disabled = on;
  btn.textContent = on ? 'Generating…' : 'Generate Preview';
}

// ── Push ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-push').addEventListener('click', async () => {
  if (!currentJobId) return;
  const btn = document.getElementById('btn-push');
  btn.disabled = true;
  btn.textContent = 'Pushing…';
  toast('Pushing to phone…', 'info');

  try {
    // Save to mission DB before pushing (idempotent — skips if already saved)
    if (currentJobId && !window._savedMissionId) {
      const nameEl = document.getElementById('mission-name');
      const saveRes = await fetch('/api/missions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: currentJobId, name: nameEl.value.trim() || 'Mission' }),
      });
      if (saveRes.ok) {
        const saved = await saveRes.json();
        window._savedMissionId = saved.mission_id;
      }
    }
    const res = await fetch(`/api/push/${currentJobId}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { toast(data.detail || 'Push failed', 'err'); return; }
    const countLabel = data.count > 1 ? `${data.count} passes` : `"${data.name}"`;
    toast(`✓ ${countLabel} pushed to Skyrover`, 'ok');
    if (document.getElementById('missions-panel').classList.contains('open')) loadMissions();
    window._savedMissionId = null;
  } catch (e) {
    toast('Push failed — is the phone plugged in?', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '📱 Push to Phone';
  }
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Missions panel ──────────────────────────────────────────────────────────

const STATUS_COLORS = {
  planned:    '#888888',
  on_phone:   '#4a90d9',
  flown:      '#4caf50',
  processing: '#f5a623',
  processed:  '#27ae60',
};

let _missionLayers = [];
let _selectedMissionId = null;

function _clearMissionLayers() {
  _missionLayers.forEach(l => map.removeLayer(l));
  _missionLayers = [];
}

function _pipelineStep(status, label) {
  const icon = status === 'done' ? '✓' : status === 'running' ? '…' : status === 'failed' ? '✗' : '·';
  return `<span class="pipeline-step step-${status}">${label} ${icon}</span>`;
}

function _renderFlight(f, missionId, hasPhonePass) {
  const div = document.createElement('div');
  div.className = 'flight-row';
  div.innerHTML = `
    <div class="flight-info">
      <div class="flight-dir">${f.raw_dir}</div>
      <div class="flight-meta">${f.photo_count} photos</div>
      <div class="pipeline-bar">
        ${_pipelineStep('done', 'RAW')}
        ${_pipelineStep(f.odm_status, 'ODM')}
        ${_pipelineStep(f.terrain_status, 'STL')}
      </div>
    </div>
    <div class="flight-actions">
      <button class="flight-btn danger btn-clear-flight" title="Mark done">Clear</button>
    </div>
  `;
  div.querySelector('.btn-clear-flight').addEventListener('click', e => {
    e.stopPropagation();
    _clearFlight(f.id, missionId, hasPhonePass, div);
  });
  return div;
}

async function _loadFlights(missionId, container, hasPhonePass) {
  container.innerHTML = '<div style="padding:4px 0;font-size:11px;color:var(--muted);">Loading…</div>';
  try {
    const res = await fetch(`/api/missions/${missionId}/flights`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      container.innerHTML = `<div style="padding:4px 0;font-size:11px;color:var(--muted);">${err.detail || 'Failed to load flights.'}</div>`;
      return;
    }
    const flights = await res.json();
    container.innerHTML = '';
    flights.forEach(f => container.appendChild(_renderFlight(f, missionId, hasPhonePass)));

    // Log flight row
    const logRow = document.createElement('div');
    logRow.className = 'log-flight-row';
    const selId = `raw-sel-${missionId}`;
    logRow.innerHTML = `
      <select id="${selId}"><option value="">Loading…</option></select>
      <button class="btn-log-confirm" disabled>+ Log</button>
    `;
    container.appendChild(logRow);

    const sel = logRow.querySelector('select');
    const btn = logRow.querySelector('button');

    fetch('/api/raw-dirs').then(r => r.json()).then(dirs => {
      sel.innerHTML = '<option value="">— pick raw dir —</option>';
      dirs.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.dir;
        opt.dataset.count = d.photo_count;
        opt.textContent = `${d.dir} (${d.photo_count} photos)`;
        sel.appendChild(opt);
      });
      if (!dirs.length) sel.innerHTML = '<option value="">No raw dirs found</option>';
    }).catch(() => { sel.innerHTML = '<option value="">Failed to load</option>'; });

    sel.addEventListener('change', () => { btn.disabled = !sel.value; });
    btn.addEventListener('click', async () => {
      const dir = sel.value;
      if (!dir) return;
      const count = parseInt(sel.selectedOptions[0]?.dataset.count || '0');
      btn.disabled = true; btn.textContent = '…';
      try {
        const r = await fetch(`/api/missions/${missionId}/flights`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ raw_dir: dir, photo_count: count }),
        });
        if (!r.ok) { toast('Failed to log flight', 'err'); return; }
        await _loadFlights(missionId, container, hasPhonePass);
        loadMissions();
        toast('Flight logged', 'ok');
      } catch { toast('Failed to log flight', 'err'); }
      finally { btn.disabled = false; btn.textContent = '+ Log'; }
    });
  } catch {
    container.innerHTML = '<div style="padding:4px 0;font-size:11px;color:var(--muted);">Failed to load.</div>';
  }
}

async function _clearFlight(flightId, missionId, hasPhonePass, container) {
  let deleteFromPhone = false;
  if (hasPhonePass) {
    deleteFromPhone = confirm('Also remove mission from Skyrover on phone?');
  } else {
    if (!confirm('Mark this flight as done?')) return;
  }
  try {
    const url = `/api/flights/${flightId}/clear${deleteFromPhone ? '?delete_from_phone=true' : ''}`;
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { toast(data.detail || 'Clear failed', 'err'); return; }
    const msg = deleteFromPhone
      ? `Done · ${data.phone_deleted} removed from phone`
      : 'Marked done';
    toast(msg, 'ok');
    if (container) {
      const panel = container.closest('.mission-flights');
      if (panel) await _loadFlights(missionId, panel, hasPhonePass);
    }
    loadMissions();
  } catch { toast('Clear failed', 'err'); }
}

async function loadMissions() {
  const list = document.getElementById('missions-list');
  try {
    const res = await fetch('/api/missions');
    const missions = await res.json();
    if (!missions.length) {
      list.innerHTML = '<div style="padding:14px;font-size:12px;color:var(--muted);">No missions yet.<br>Draw a polygon and generate one.</div>';
      return;
    }
    list.innerHTML = '';
    missions.forEach(m => {
      const wrapper = document.createElement('div');

      const item = document.createElement('div');
      item.className = 'mission-item';
      item.dataset.id = m.id;
      const d = new Date((m.created_at || 0) * 1000);
      item.innerHTML = `
        <div class="mission-item-name">
          ${m.name}
          <span class="mission-status status-${m.status}">${m.status.replace(/_/g, ' ')}</span>
        </div>
        <div class="mission-item-meta">${m.mode} · ${m.altitude || '?'}m · ${d.toLocaleDateString()}</div>
      `;

      const flightsPanel = document.createElement('div');
      flightsPanel.className = 'mission-flights';

      const hasPhonePass = m.passes_on_phone > 0;

      item.addEventListener('click', () => {
        const isOpen = flightsPanel.classList.toggle('open');
        if (isOpen) _loadFlights(m.id, flightsPanel, hasPhonePass);
        _visualizeMission(m.id, item);
      });

      wrapper.appendChild(item);
      wrapper.appendChild(flightsPanel);
      list.appendChild(wrapper);
    });
  } catch {
    list.innerHTML = '<div style="padding:14px;font-size:12px;color:var(--muted);">Failed to load.</div>';
  }
}

function _visualizeMission(missionId, el) {
  document.querySelectorAll('.mission-item.selected').forEach(d => d.classList.remove('selected'));
  _clearMissionLayers();
  if (_selectedMissionId === missionId) { _selectedMissionId = null; return; }
  _selectedMissionId = missionId;
  el.classList.add('selected');
  fetch(`/api/missions/${missionId}/waypoints`)
    .then(r => r.json())
    .then(passes => {
      passes.forEach(p => {
        if (!p.waypoints.length) return;
        const color = p.on_phone ? STATUS_COLORS.on_phone : STATUS_COLORS.planned;
        const lls = p.waypoints.map(wp => [wp[0], wp[1]]);
        _missionLayers.push(L.polyline(lls, { color, weight: 1.5, opacity: .8 }).addTo(map));
        _missionLayers.push(L.circleMarker(lls[0], { radius: 5, color, fillColor: color, fillOpacity: 1 }).addTo(map));
      });
      if (_missionLayers.length) map.fitBounds(L.featureGroup(_missionLayers).getBounds(), { padding: [40, 40] });
    })
    .catch(() => toast('Failed to load waypoints', 'err'));
}

document.getElementById('btn-missions').addEventListener('click', () => {
  const panel = document.getElementById('missions-panel');
  const isOpen = panel.classList.toggle('open');
  document.getElementById('btn-missions').classList.toggle('active', isOpen);
  if (isOpen) loadMissions();
});

document.getElementById('btn-sync-phone').addEventListener('click', async () => {
  const btn = document.getElementById('btn-sync-phone');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try {
    const res = await fetch('/api/missions/sync/sync-phone', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { toast(data.detail || 'Sync failed', 'err'); return; }
    toast(`Sync done · ${data.matched} matched · ${data.newly_deleted} removed · ${data.imported ?? 0} imported`, 'ok');
    loadMissions();
  } catch {
    toast('Sync failed — phone plugged in?', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '📱 Sync';
  }
});
</script>
</body>
