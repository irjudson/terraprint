services:
  processor:
    build:
      context: ./docker/processor
      args:
        HOST_UID: ${HOST_UID:-1000}
    image: terraprint/processor:latest
    profiles:
      - cli
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
      - ./configs:/workspace/configs:ro
      - ~/.config/earthengine:/home/tp/.config/earthengine
    environment:
      PYTHONUNBUFFERED: "1"
    working_dir: /workspace

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: terraprint/web:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    restart: unless-stopped

  odm:
    image: opendronemap/odm:latest
    profiles:
      - odm
    volumes:
      - ./data/01_odm/${FLIGHT:-_placeholder}:/datasets/code
      - ./data/00_raw/${FLIGHT:-_placeholder}:/datasets/code/images:ro
